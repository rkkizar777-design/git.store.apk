<svg xmlns="http://www.w3.org/2000/svg" width="560" height="500" viewBox="0 0 560 500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="bgd" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#10182b"/>
      <stop offset="100%" stop-color="#05060a"/>
    </radialGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="phGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(34,211,238,0.28)"/>
      <stop offset="100%" stop-color="rgba(34,211,238,0)"/>
    </radialGradient>
    <filter id="soft2" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="screen"><rect x="120" y="16" width="320" height="446" rx="20"/></clipPath>
  </defs>

  <rect width="560" height="500" fill="url(#bgd)"/>
  <ellipse cx="280" cy="250" rx="300" ry="280" fill="url(#phGlow)">
    <animate attributeName="opacity" values="0.5;0.85;0.5" dur="6s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Phone frame -->
  <rect x="108" y="4" width="344" height="472" rx="50" fill="#0b0e14" stroke="rgba(255,255,255,0.14)" stroke-width="2"/>
  <circle cx="280" cy="12" r="4" fill="#151a26" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <rect x="120" y="16" width="320" height="446" rx="20" fill="#0d1322"/>

  <g clip-path="url(#screen)">
    <!-- island header -->
    <g>
      <rect x="178" y="26" width="204" height="30" rx="15" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.12)"/>
      <circle cx="196" cy="41" r="7" fill="url(#acc)"/>
      <text x="210" y="45" font-size="12.5" font-weight="700" fill="#e2e8f0">GitSearch</text>
      <circle cx="368" cy="41" r="3.5" fill="#64748b"/>
    </g>

    <!-- search bar -->
    <g>
      <rect x="140" y="70" width="280" height="40" rx="20" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
      <circle cx="160" cy="90" r="8" fill="none" stroke="#7dd3fc" stroke-width="2.2"/>
      <path d="M166 96 l6 6" stroke="#7dd3fc" stroke-width="2.2" stroke-linecap="round"/>
      <text x="180" y="95" font-size="13" fill="#cbd5e1">react native hooks</text>
      <rect x="302" y="86" width="7" height="17" rx="2" fill="#7dd3fc">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
      <!-- shimmer sweep -->
      <g opacity="0.5">
        <path d="M140 90 L320 90 L320 96 L140 96 Z" fill="url(#acc)">
          <animate attributeName="x" values="130;420;130" dur="3.4s" repeatCount="indefinite" xlink:href="#null"/>
          <animate attributeName="opacity" values="0;0.25;0" dur="3.4s" repeatCount="indefinite"/>
        </path>
      </g>
      <rect x="398" y="82" width="16" height="16" rx="4" fill="#ec4899"/>
      <path d="M402 86h4v4h-4z M406 90h4v4h-4z M402 94h4v4h-4z" fill="#0b0e14"/>
    </g>

    <!-- repo cards -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="-40,0;0,0" dur="0.5s" begin="0.7s" fill="freeze"/>
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.7s" fill="freeze"/>
      <rect x="140" y="124" width="280" height="62" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.09)"/>
      <circle cx="160" cy="145" r="6" fill="#22d3ee"/>
      <text x="176" y="150" font-size="12.5" font-weight="700" fill="#e2e8f0">facebook/react-native</text>
      <rect x="158" y="160" width="150" height="5" rx="2.5" fill="rgba(255,255,255,0.12)"/>
      <text x="158" y="178" font-size="10.5" fill="#94a3b8">⭐ 121k  🍴 26k</text>
      <text x="392" y="172" font-size="9.5" fill="#7dd3fc" text-anchor="end">↗ share</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="-40,0;0,0" dur="0.5s" begin="1.2s" fill="freeze"/>
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.2s" fill="freeze"/>
      <rect x="140" y="196" width="280" height="62" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.09)"/>
      <circle cx="160" cy="217" r="6" fill="#a855f7"/>
      <text x="176" y="222" font-size="12.5" font-weight="700" fill="#e2e8f0">vitejs/vite</text>
      <rect x="158" y="232" width="120" height="5" rx="2.5" fill="rgba(255,255,255,0.12)"/>
      <text x="158" y="250" font-size="10.5" fill="#94a3b8">⭐ 68k  🍴 6k</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="-40,0;0,0" dur="0.5s" begin="1.7s" fill="freeze"/>
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.7s" fill="freeze"/>
      <rect x="140" y="268" width="280" height="62" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.09)"/>
      <circle cx="160" cy="289" r="6" fill="#34d399"/>
      <text x="176" y="294" font-size="12.5" font-weight="700" fill="#e2e8f0">axios/axios</text>
      <rect x="158" y="304" width="100" height="5" rx="2.5" fill="rgba(255,255,255,0.12)"/>
      <text x="158" y="322" font-size="10.5" fill="#94a3b8">⭐ 106k  🍴 11k</text>
    </g>

    <!-- README sheet -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,130;0,0" dur="0.55s" begin="3.3s" fill="freeze" calcMode="spline" keySplines="0.34 1.3 0.64 1" keyTimes="0;1"/>
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="3.3s" fill="freeze"/>
      <rect x="120" y="330" width="320" height="106" fill="#0b101c" stroke="rgba(255,255,255,0.12)" stroke-width="1" stroke-linecap="round"/>
      <rect x="256" y="340" width="48" height="4" rx="2" fill="rgba(255,255,255,0.2)"/>
      <text x="140" y="362" font-size="12" font-weight="700" fill="#7dd3fc">README.md</text>
      <rect x="140" y="374" width="200" height="5" rx="2.5" fill="rgba(255,255,255,0.14)"/>
      <rect x="140" y="384" width="230" height="5" rx="2.5" fill="rgba(255,255,255,0.09)"/>
      <rect x="140" y="394" width="180" height="5" rx="2.5" fill="rgba(255,255,255,0.09)"/>
      <rect x="140" y="404" width="280" height="24" rx="6" fill="rgba(255,255,255,0.05)"/>
      <text x="148" y="420" font-size="10.5" font-family="Consolas, monospace" fill="#86efac">npx cap add android</text>
    </g>

    <!-- bottom nav -->
    <g>
      <rect x="140" y="436" width="280" height="24" rx="12" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.10)"/>
      <rect x="152" y="440" width="34" height="16" rx="8" fill="url(#acc)"/>
      <circle cx="169" cy="448" r="8" fill="none" stroke="#7dd3fc" stroke-width="1.5">
        <animateTransform attributeName="transform" type="scale" values="0.8;1.9" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="220" cy="448" r="3" fill="#475569"/>
      <circle cx="276" cy="448" r="3" fill="#475569"/>
      <circle cx="332" cy="448" r="3" fill="#475569"/>
      <circle cx="384" cy="448" r="3" fill="#475569"/>
    </g>
  </g>
</svg>

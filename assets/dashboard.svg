<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="35%" r="85%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#05060a"/>
    </radialGradient>
    <linearGradient id="lg1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="lg2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="blur3" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="900" height="300" fill="url(#bg3)"/>

  <!-- LIVE pill -->
  <g transform="translate(690,26)">
    <rect x="0" y="0" width="150" height="28" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)"/>
    <circle cx="18" cy="14" r="5" fill="#34d399">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="19" font-size="12" font-weight="700" fill="#cbd5e1">LIVE · RELEASE FEED</text>
  </g>

  <!-- Stat card: Version -->
  <g transform="translate(30,78)">
    <rect width="200" height="196" rx="18" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.09)"/>
    <text x="100" y="34" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="middle" letter-spacing="1.5">VERSION</text>
    <text x="100" y="86" font-size="34" font-weight="800" fill="#e2e8f0" text-anchor="middle">1.0.0.19</text>
    <g transform="translate(100,116)">
      <g>
        <circle r="26" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="4 5">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
    <text x="100" y="168" font-size="11" fill="#94a3b8" text-anchor="middle">Continuous · shipped from CI</text>
  </g>

  <!-- Stat card: Downloads -->
  <g transform="translate(250,78)">
    <rect width="200" height="196" rx="18" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.09)"/>
    <text x="100" y="34" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="middle" letter-spacing="1.5">DOWNLOAD</text>
    <text x="100" y="86" font-size="34" font-weight="800" fill="#7dd3fc" text-anchor="middle">One tap</text>
    <text x="100" y="110" font-size="11" fill="#94a3b8" text-anchor="middle">straight from this release</text>
    <g transform="translate(42,138)">
      <rect x="0" y="0" width="116" height="34" rx="17" fill="url(#lg1)"/>
      <text x="58" y="21" font-size="12.5" font-weight="800" fill="#05060a" text-anchor="middle">GET APK →</text>
    </g>
    <g transform="translate(100,150)">
      <circle r="20" fill="none" stroke="#22d3ee" stroke-width="1.5">
        <animateTransform attributeName="transform" type="scale" values="0.6;1.9" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- Stat card: Size -->
  <g transform="translate(470,78)">
    <rect width="200" height="196" rx="18" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.09)"/>
    <text x="100" y="34" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="middle" letter-spacing="1.5">APK SIZE</text>
    <text x="100" y="86" font-size="34" font-weight="800" fill="#f0abfc" text-anchor="middle">~6.9 MB</text>
    <g transform="translate(42,120)">
      <rect x="0" y="8" width="116" height="8" rx="4" fill="rgba(255,255,255,0.08)"/>
      <rect x="0" y="8" width="116" height="8" rx="4" fill="url(#lg2)">
        <animate attributeName="width" values="0;116" dur="1.8s" begin="0.5s" fill="freeze"/>
      </rect>
    </g>
    <text x="100" y="168" font-size="11" fill="#94a3b8" text-anchor="middle">Slim · loads in a flash</text>
  </g>

  <!-- Chart card -->
  <g transform="translate(690,78)">
    <rect width="180" height="196" rx="18" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.09)"/>
    <text x="90" y="34" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="middle" letter-spacing="1.5">DELIVERY CADENCE</text>
    <g transform="translate(24,60)">
      <g transform="translate(12,108)">
        <rect x="0" y="0" width="8" height="10" rx="3" fill="url(#lg1)">
          <animate attributeName="height" values="10;42;10" dur="2s" repeatCount="indefinite"/>
          <animate attributeName="y" values="0;-32;0" dur="2s" repeatCount="indefinite"/>
        </rect>
        <rect x="22" y="0" width="8" height="10" rx="3" fill="url(#lg2)" transform="translate(0,0)">
          <animateTransform attributeName="transform" type="translate" values="0,0;0,-40;0,0" dur="2.2s" begin="0.2s" repeatCount="indefinite"/>
        </rect>
        <rect x="44" y="0" width="8" height="10" rx="3" fill="url(#lg1)">
          <animateTransform attributeName="transform" type="translate" values="0,0;0,-28;0,0" dur="1.8s" begin="0.4s" repeatCount="indefinite"/>
        </rect>
        <rect x="66" y="0" width="8" height="10" rx="3" fill="url(#lg2)">
          <animateTransform attributeName="transform" type="translate" values="0,0;0,-52;0,0" dur="2.5s" begin="0.6s" repeatCount="indefinite"/>
        </rect>
        <rect x="88" y="0" width="8" height="10" rx="3" fill="url(#lg1)">
          <animateTransform attributeName="transform" type="translate" values="0,0;0,-36;0,0" dur="2.1s" begin="0.8s" repeatCount="indefinite"/>
        </rect>
        <rect x="110" y="0" width="8" height="10" rx="3" fill="url(#lg2)">
          <animateTransform attributeName="transform" type="translate" values="0,0;0,-46;0,0" dur="2.4s" begin="1s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>
    <text x="90" y="194" font-size="11" fill="#94a3b8" text-anchor="middle">Every change ships fast</text>
  </g>

  <text x="450" y="286" font-size="12" font-weight="700" fill="#64748b" text-anchor="middle" letter-spacing="2">LIVE · DASHBOARD</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="80%">
      <stop offset="0%" stop-color="#111a30"/>
      <stop offset="55%" stop-color="#07090f"/>
      <stop offset="100%" stop-color="#05060a"/>
    </radialGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="55%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="45%" stop-color="#7dd3fc"/>
      <stop offset="55%" stop-color="#f0abfc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.45,0;0.45,0;-0.45,0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(99,102,241,0.55)"/>
      <stop offset="100%" stop-color="rgba(99,102,241,0)"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="330" fill="url(#bg)"/>
  <rect width="900" height="330" fill="url(#grid)" opacity="0.7">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="6s" repeatCount="indefinite"/>
  </rect>
  <ellipse cx="450" cy="165" rx="520" ry="240" fill="url(#glow)" opacity="0.5">
    <animate attributeName="opacity" values="0.35;0.6;0.35" dur="8s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Logo: neon search lens holding a git branch -->
  <g transform="translate(150,165)">
    <g>
      <circle r="74" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.35" stroke-dasharray="6 10">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
      </circle>
      <circle r="84" fill="none" stroke="#ec4899" stroke-width="1.5" opacity="0.25" stroke-dasharray="3 12">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="20s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g filter="url(#soft)" opacity="0.9">
      <circle r="52" fill="url(#glow)"/>
    </g>
    <g>
      <circle r="52" fill="none" stroke="url(#lens)" stroke-width="5" stroke-dasharray="16 10" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g>
      <circle r="52" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
    </g>
    <circle cx="-14" cy="-18" r="11" fill="rgba(255,255,255,0.10)">
      <animate attributeName="cx" values="-14;10;-14" dur="6s" repeatCount="indefinite"/>
    </circle>
    <!-- git branch -->
    <g fill="#f8fafc">
      <circle cx="-4" cy="-6" r="4"/>
      <circle cx="18" cy="-18" r="4"/>
      <circle cx="18" cy="10" r="4"/>
      <path d="M-4-6h8c6 0 10 3 12 8" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>
      <path d="M-4-6c-4 0-7 2-8 6" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    </g>
    <g transform="translate(52,-44)">
      <g>
        <path d="M0 8 C 3 3, 3 -3, 0 -8 C -3 -3, -3 3, 0 8 Z" fill="#fde047">
          <animateTransform attributeName="transform" type="scale" values="0.6;1.15;0.6" dur="2.2s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>
  </g>

  <!-- Copy -->
  <g transform="translate(272,0)">
    <text x="0" y="86" font-size="54" font-weight="800" letter-spacing="-1.5" fill="url(#titleGrad)">GitSearch</text>
    <g transform="translate(0,112)">
      <rect x="0" y="0" width="96" height="6" rx="3" fill="url(#btn)">
        <animate attributeName="opacity" values="0.75;1;0.75" dur="3s" repeatCount="indefinite"/>
      </rect>
    </g>
    <text x="0" y="168" font-size="20" font-weight="600" fill="#94a3b8">Discover GitHub, made beautiful.</text>
    <g>
      <rect x="296" y="152" width="12" height="22" rx="2" fill="#7dd3fc">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g transform="translate(0,204)">
      <rect x="0" y="0" width="218" height="44" rx="22" fill="rgba(255,255,255,0.05)" stroke="url(#btn)" stroke-width="1.5"/>
      <text x="26" y="27" font-size="15" font-weight="700" fill="#e2e8f0">⬇  Download APK</text>
      <g transform="translate(190,22)">
        <path d="M-7 -5 L0 2 L7 -5" fill="none" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <animate attributeName="transform" type="translate" values="0,0;0,4;0,0" dur="1.4s" repeatCount="indefinite"/>
        </path>
      </g>
      <g transform="translate(109,22)">
        <circle r="20" fill="none" stroke="#22d3ee" stroke-width="1.5">
          <animateTransform attributeName="transform" type="scale" values="0.7;1.6" dur="2.2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.9;0" dur="2.2s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
  </g>

  <!-- floating sparks -->
  <circle cx="620" cy="70" r="2.4" fill="#22d3ee"><animate attributeName="cy" values="70;40;70" dur="5s" repeatCount="indefinite"/></circle>
  <circle cx="690" cy="120" r="2" fill="#ec4899"><animate attributeName="cy" values="120;92;120" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="760" cy="180" r="2.6" fill="#a3e635"><animate attributeName="cy" values="180;152;180" dur="6s" repeatCount="indefinite"/></circle>
  <circle cx="300" cy="300" r="2" fill="#7dd3fc"><animate attributeName="cy" values="300;278;300" dur="4.5s" repeatCount="indefinite"/></circle>
  <circle cx="860" cy="300" r="2.2" fill="#f0abfc"><animate attributeName="cy" values="300;282;300" dur="5.5s" repeatCount="indefinite"/></circle>
</svg>
